<html lang="tr">
<head>

    <style>
        :root {
            --accent: #38bdf8;
            --accent2: #818cf8;
            --glow: rgba(56, 189, 248, 0.35);
            --bg: #020617;
            --bg2: #0f172a;
            --glass: rgba(30, 41, 59, 0.45);
            --border: rgba(255,255,255,0.08);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 60px;
            background: rgba(2,6,23,0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        /* Logoyu görselle hizalamak için flex eklendi */
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-logo img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--text); }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56,189,248,0.1);
            border: 1px solid rgba(56,189,248,0.3);
            border-radius: 999px;
            padding: 6px 18px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(52px, 8vw, 96px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-sub {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(18px, 3vw, 26px);
            color: var(--muted);
            font-weight: 400;
            margin-bottom: 48px;
            letter-spacing: 1px;
        }

        .hero-sub strong {
            color: var(--text);
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 64px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #020617;
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 800;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 4px 30px var(--glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px var(--glow);
            background: #7dd3fc;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: var(--glass);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            gap: 48px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── FEATURES ── */
        .features {
            padding: 100px 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-label {
            text-align: center;
            font-size: 13px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .section-title {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .section-desc {
            text-align: center;
            color: var(--muted);
            font-size: 17px;
            max-width: 560px;
            margin: 0 auto 64px;
            line-height: 1.7;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(12px);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56,189,248,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .feature-card:hover::before { opacity: 1; }

        .feature-icon {
            font-size: 36px;
            margin-bottom: 20px;
            display: block;
        }

        .feature-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .feature-desc {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* ── DOWNLOAD SECTION ── */
        .download-section {
            padding: 100px 24px;
            text-align: center;
            position: relative;
        }

        .download-card {
            max-width: 680px;
            margin: 48px auto 0;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .download-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        .version-badge {
            background: rgba(56,189,248,0.1);
            border: 1px solid rgba(56,189,248,0.2);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .download-title {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .download-desc {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .download-info {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .info-item {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item span { color: var(--text); font-weight: 600; }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .footer-logo img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .footer-text {
            color: var(--muted);
            font-size: 13px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover { color: var(--accent); }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* ── PARTICLES ── */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(56,189,248,0.4);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }
