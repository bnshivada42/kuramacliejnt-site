<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuramaClient — KuramaMC'nin Özel Launcher'ı</title>
    <meta name="description" content="KuramaMC sunucusu için özel olarak geliştirilmiş, otomatik giriş ve premium özelliklere sahip Minecraft launcher'ı. Hemen indir, rekabete katıl!" />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KuramaClient — KuramaMC'nin Özel Launcher'ı" />
    <meta property="og:description" content="KuramaMC sunucusu için özel olarak geliştirilmiş Minecraft launcher'ı." />
    <meta property="og:image" content="mcicon.png" />

    <link rel="icon" type="image/png" href="mcicon.png" />
    <link rel="apple-touch-icon" href="mcicon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #080710;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent-blue: #00d2ff;
            --accent-purple: #0045ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Glow Efektleri */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 69, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
        }

        /* Ana Konteyner */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out;
        }

        /* Logo Alanı */
        .logo-area {
            position: relative;
            margin-bottom: 25px;
            display: inline-block;
        }

        .logo-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        /* Başlıklar */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #858585 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Buton Grubu */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Sürüm Bilgisi */
        .version-tag {
            display: inline-block;
            margin-top: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Animasyonlar */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobil Optimizasyon */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="container">
        <div class="logo-area">
            <img src="mcicon.png" alt="KuramaClient Logo" class="logo-img" />
        </div>
        
        <h1>KuramaClient</h1>
        <p class="subtitle">KuramaMC sunucusuna özel optimize edilmiş, otomatik giriş ve yüksek FPS destekli resmi Minecraft Launcher.</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">Hemen İndir (.exe)</a>
            <a href="https://kuramamc.online" class="btn btn-secondary">Ana Sayfaya Dön</a>
        </div>

        <span class="version-tag">SÜRÜM v1.0.0 — FABRIC TABANLI</span>
    </div>

</body>
</html>
